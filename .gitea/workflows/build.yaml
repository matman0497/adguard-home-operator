name: Build and Push Docker Image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: s4u/maven-settings-action@v4.0.0
        with:
          servers: |
            [{
              "id": "gitea",
              "configuration": {
                "httpHeaders": {
                  "property": {
                    "name": "Authorization",
                    "value": "token abc"
                }
              }
            }]

      - name: Build app
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          architecture: x64

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          platforms: |
            linux/amd64
          push: true
          tags: | 
            gitea.internal.total-chaos.cloud/homelab/adguard-home-operator:latest