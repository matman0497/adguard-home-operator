name: Build and Push Docker Image

on:
  push:
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to the Container registry
        uses: docker/login-action@v2
        with:
          registry: gitea.internal.total-chaos.cloud
          username: ${{ gitea.actor }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          platforms: |
            linux/amd64
          push: true
          tags: | 
            gitea.internal.total-chaos.cloud/mmancina/adguard-home-operator:latest
            gitea.internal.total-chaos.cloud/mmancina/adguard-home-operator:${{ gitea.sha }}