apiVersion: v1
kind: Namespace
metadata:
  name: adguardhome-operator
  labels:
    name: adguardhome-operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: adguardhome-operator
rules:
  - apiGroups: ["com.matman0497"]
    resources: ["adguarddnsrewrites"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: adguardhome-operator
subjects:
  - kind: ServiceAccount
    name: default
    namespace: adguardhome-operator
roleRef:
  kind: ClusterRole
  name: adguardhome-operator
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: Secret
metadata:
  name: adguardhome-password
  namespace: adguardhome-operator
type: Opaque
stringData:
  password: "ADD_PASSWORD_HERE"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: adguardhome-operator
  namespace: adguardhome-operator
  labels:
    app: adguardhome-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app:  adguardhome-operator
  template:
    metadata:
      labels:
        app:  adguardhome-operator
    spec:
      containers:
        - name: adguardhome-operator
          image: gitea.internal.total-chaos.cloud/mmancina/adguard-home-operator:c5ba464f2c93ac2a4ef343e96cf8e67b6def9fe3
          imagePullPolicy: Always
          env:
            - name: CLIENT_BASE_URL
              value: "http://192.168.8.254/control/"
            - name: ADGUARD_USERNAME
              value: "admin"
            - name: ADGUARD_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: adguardhome-password
                  key: password